providers:
  - name: mock
    type: mock
    models: ["mock"]

  - name: ollama-local
    type: ollama
    base_url: http://localhost:11434
    models: ["qwen2.5:0.5b"]
    timeout: 120

  - name: groq
    type: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    models: ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]
    timeout: 30