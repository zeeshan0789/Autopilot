services:
  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Rate limit counters temporary hain, disk pe save karne ki zarurat nahi
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: autopilot-postgres
    environment:
      POSTGRES_USER: autopilot
      POSTGRES_PASSWORD: autopilot_dev # sirf local dev, port bahar nahi khula
      POSTGRES_DB: autopilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autopilot -d autopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: