name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: autopilot
          POSTGRES_PASSWORD: autopilot_dev
          POSTGRES_DB: autopilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autopilot -d autopilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    defaults:
      run:
        working-directory: ai-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-gateway/requirements.txt
      - name: Install (CPU only PyTorch first, so the requirements do not pull the CUDA build)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Migrate the database
        run: alembic upgrade head
      - name: Tests (the ones that load the real embedding model are skipped)
        run: pytest -q -m "not slow"

  web-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-api/package-lock.json
      - run: npm ci
      - run: npm test

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  stack:
    runs-on: ubuntu-latest
    needs: [gateway, web-api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Config files for the stack
        run: |
          cp ai-gateway/.env.example ai-gateway/.env
          cp web-api/.env.example web-api/.env
      - name: Build and start everything
        run: docker compose --profile gateway up -d --build
      - name: Wait for the services
        run: |
          curl -fsS --retry 60 --retry-delay 5 --retry-connrefused http://127.0.0.1:8000/health
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:3001/api/health
          curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/ > /dev/null
      - name: A request through the gateway with the mock provider
        run: |
          KEY=$(docker compose exec -T gateway python -m scripts.create_key ci 60 | grep -o 'ap-[A-Za-z0-9_-]*' | head -1)
          test -n "$KEY"
          curl -fsS -D headers.txt -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"model":"mock","messages":[{"role":"user","content":"hello"}]}' \
            http://127.0.0.1:8000/v1/chat/completions
          grep -i '^x-autopilot-provider: mock' headers.txt
      - name: Logs when something failed
        if: failure()
        run: docker compose --profile gateway logs --tail 100