services:
  redis:
    image: redis:7-alpine
    container_name: autopilot-redis
    ports:
      - "127.0.0.1:6379:6379"
    # Rate limit counters temporary hain, disk pe save karne ki zarurat nahi
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5